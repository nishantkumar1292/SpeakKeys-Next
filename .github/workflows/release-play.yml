name: Release Android to Google Play closed testing

# pull_request_target lets merged PRs from forks use the trusted base workflow.
# The build job is gated on merged == true and checks out the trusted main SHA;
# the job that receives Play credentials never checks out repository code.
on:
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - app/src/main/**
      - app/src/release/**
      - app/build.gradle.kts
      - app/proguard-rules.pro
      - shared/src/commonMain/**
      - shared/src/androidMain/**
      - shared/build.gradle.kts
      - build.gradle.kts
      - settings.gradle
      - gradle.properties
      - gradle/**
      - gradlew
      - gradlew.bat
  workflow_dispatch:

permissions: {}

# Google Play edits must be serialized. queue: max preserves up to 100 merged
# Android PR releases instead of replacing an older pending run.
concurrency:
  group: speakkeys-google-play-closed-testing
  queue: max

jobs:
  build:
    name: Test and build unsigned bundle
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      version_code: ${{ steps.version.outputs.code }}

    steps:
      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108"

      - name: Allocate Android version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Keep Play codes compact and sequential. Settings migrations use a
          # separate counter in AppUpgrade. A rerun reuses its Play code; a new
          # manual run allocates another.
          readonly version_code_base=102
          readonly run_number="${GITHUB_RUN_NUMBER}"
          readonly run_attempt="${GITHUB_RUN_ATTEMPT}"
          for value in "$run_number" "$run_attempt"; do
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "GitHub supplied a non-numeric run identifier: $value" >&2
              exit 1
            fi
          done
          code="$((version_code_base + run_number))"
          readonly code

          if (( code <= 102 || code > 2100000000 )); then
            echo "Generated versionCode is outside the allowed range: $code" >&2
            exit 1
          fi

          {
            echo "code=$code"
            echo "artifact_name=play-bundle-$code-attempt-$run_attempt"
          } >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :app:testRunTestsUnitTest

      - name: Materialize Firebase configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.SPEAKKEYS_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "Missing SPEAKKEYS_GOOGLE_SERVICES_JSON_BASE64 repository secret." >&2
            exit 1
          fi

          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          jq -e '
            .client
            | any(.client_info.android_client_info.package_name == "com.speakkeys.keyboard")
          ' app/google-services.json > /dev/null

      - name: Build unsigned Play bundle
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            :app:bundleRelease \
            -PspeakkeysVersionCode="${{ steps.version.outputs.code }}" \
            -PspeakkeysVersionNameSuffix="${{ steps.version.outputs.code }}" \
            -PspeakkeysUnsignedRelease=true

      - name: Remove Firebase configuration
        if: always()
        shell: bash
        run: rm -f app/google-services.json

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab')
          if [[ "${#bundles[@]}" -ne 1 ]]; then
            echo "Expected exactly one release bundle, found ${#bundles[@]}." >&2
            exit 1
          fi

          install -D -m 0644 "${bundles[0]}" dist/SpeakKeys.aab
          install -D -m 0644 app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          install -D -m 0644 \
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip \
            dist/native-debug-symbols.zip

      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            dist/SpeakKeys.aab
            dist/mapping.txt
            dist/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish to Google Play closed testing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: google-play-closed-testing
    permissions:
      actions: read
      id-token: write

    steps:
      # Deliberately no checkout: repository code cannot access the upload key
      # or the short-lived Google Play credential in this job.
      - name: Validate publisher configuration
        shell: bash
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "${WORKLOAD_IDENTITY_PROVIDER:-}" ]]; then
            echo "Missing GCP_WORKLOAD_IDENTITY_PROVIDER environment variable." >&2
            exit 1
          fi
          if [[ -z "${PLAY_SERVICE_ACCOUNT:-}" ]]; then
            echo "Missing GOOGLE_PLAY_SERVICE_ACCOUNT environment variable." >&2
            exit 1
          fi

      - name: Download unsigned release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Sign and verify app bundle
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.SPEAKKEYS_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.SPEAKKEYS_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.SPEAKKEYS_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.SPEAKKEYS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            UPLOAD_KEYSTORE_BASE64 \
            UPLOAD_STORE_PASSWORD \
            UPLOAD_KEY_ALIAS \
            UPLOAD_KEY_PASSWORD
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required GitHub Environment secret: $variable" >&2
              exit 1
            fi
          done

          readonly keystore="$RUNNER_TEMP/speakkeys-upload.jks"
          readonly verify_log="$RUNNER_TEMP/jarsigner-verify.txt"
          trap 'rm -f "$keystore" "$verify_log"' EXIT
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          jarsigner \
            -keystore "$keystore" \
            -storepass:env UPLOAD_STORE_PASSWORD \
            -keypass:env UPLOAD_KEY_PASSWORD \
            dist/SpeakKeys.aab \
            "$UPLOAD_KEY_ALIAS"
          jarsigner -verify -verbose dist/SpeakKeys.aab > "$verify_log"
          if ! grep -Fq "jar verified." "$verify_log"; then
            echo "The app bundle signature could not be verified." >&2
            cat "$verify_log" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}

      - name: Upload Google Play closed-testing release
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.google-auth.outputs.credentials_file_path }}
          packageName: com.speakkeys.keyboard
          releaseFiles: dist/SpeakKeys.aab
          # Google Play's initial closed-testing track uses the API name alpha.
          tracks: alpha
          status: completed
          mappingFile: dist/mapping.txt
          debugSymbols: dist/native-debug-symbols.zip

      - name: Remove signed release files
        if: always()
        shell: bash
        run: rm -f dist/SpeakKeys.aab dist/mapping.txt dist/native-debug-symbols.zip
