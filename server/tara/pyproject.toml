[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "speakkeys-tara-server"
version = "0.1.0"
description = "Low-latency WebSocket serving for Trelis Tara in SpeakKeys"
requires-python = ">=3.10"
dependencies = [
    "ctranslate2>=4.8,<5",
    "fastapi>=0.115,<1",
    "firebase-admin>=6.5,<8",
    "numpy>=1.26,<3",
    "prometheus-client>=0.21,<1",
    "transformers>=4.48,<6",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
